---
# Example ExternalSecret - demonstrates how to sync a secret from 1Password
# 
# To use this:
# 1. Create a secret in your 1Password vault (e.g., "Kubernetes" vault)
# 2. Note the item name (e.g., "example-app-credentials")
# 3. The item should have fields like: username, password, api-key, etc.
# 4. Update the spec below with your vault and item names
# 5. The secret will be synced to the namespace specified in spec.target.name
#
# NOTE: This is a commented-out example. Uncomment and customize when ready to use.
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: example-app-secret
#   namespace: external-secrets
# spec:
#   # Refresh interval
#   refreshInterval: 1h
#   
#   # Reference to the SecretStore
#   secretStoreRef:
#     name: onepassword
#     kind: SecretStore
#   
#   # Target Kubernetes Secret
#   target:
#     name: example-app-secret
#     creationPolicy: Owner
#     template:
#       type: Opaque
#   
#   # Data to sync from 1Password
#   data:
#     # Sync specific fields from a 1Password item
#     - secretKey: username
#       remoteRef:
#         key: example-app-credentials  # 1Password item name
#         property: username             # Field name in the item
#     
#     - secretKey: password
#       remoteRef:
#         key: example-app-credentials
#         property: password
#     
#     - secretKey: api-key
#       remoteRef:
#         key: example-app-credentials
#         property: api-key
---
