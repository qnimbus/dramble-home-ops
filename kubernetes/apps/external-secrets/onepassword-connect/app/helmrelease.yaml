---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  chart:
    spec:
      chart: connect
      version: ">=1.15.0"
      sourceRef:
        kind: HelmRepository
        name: onepassword-connect
      interval: 6h
  interval: 1h
  driftDetection:
    mode: enabled
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      retries: 3
      strategy: rollback
  values:
    connect:
      replicas: 1
      credentials: onepassword-connect-secret
      dataVolume:
        type: emptyDir
        values:
          sizeLimit: 1Gi
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
    operator:
      create: false
