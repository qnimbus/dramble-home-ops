---
# yaml-language-server: $schema=talconfig.schema.json
clusterName: dramble
clusterPodNets:
  - ${CLUSTER_POD_SUBNET} # See talenv.yaml file
clusterSvcNets:
  - ${CLUSTER_SERVICE_SUBNET} # See talenv.yaml file
endpoint: "https://${CLUSTER_ENDPOINT}:6443"
talosVersion: v1.11.3
kubernetesVersion: v1.34.1
nodes:
  - hostname: arm64-node-1
    controlPlane: true
    ipAddress: 10.60.0.101
    installDisk: /dev/mmcblk0
    networkInterfaces:
      - deviceSelector:
          driver: bcmgenet
        vip:
          ip: ${CLUSTER_ENDPOINT}
    # networkInterfaces:
    #   - interface: end0
    #     addresses:
    #       - 10.60.0.101/24
    #     dhcp: false
    #     mtu: 1500
    #     routes:
    #       - network: 0.0.0.0/0
    #         gateway: ${CLUSTER_LAN_GATEWAY}
    #     vip:
    #       ip: ${CLUSTER_VIP}
  - hostname: arm64-node-2
    controlPlane: false
    ipAddress: 10.60.0.102
    installDisk: /dev/mmcblk0
    # networkInterfaces:
    #   - interface: end0
    #     addresses:
    #       - 10.60.0.102/24
    #     dhcp: false
    #     mtu: 1500
    #     routes:
    #       - network: 0.0.0.0/0
    #         gateway: ${CLUSTER_LAN_GATEWAY}
  - hostname: arm64-node-3
    controlPlane: false
    ipAddress: 10.60.0.103
    installDisk: /dev/mmcblk0
    # networkInterfaces:
    #   - interface: end0
    #     addresses:
    #       - 10.60.0.103/24
    #     dhcp: false
    #     mtu: 1500
    #     routes:
    #       - network: 0.0.0.0/0
    #         gateway: ${CLUSTER_LAN_GATEWAY}
  - hostname: arm64-node-4
    controlPlane: false
    ipAddress: 10.60.0.104
    installDisk: /dev/mmcblk0
    # networkInterfaces:
    #   - interface: end0
    #     addresses:
    #       - 10.60.0.104/24
    #     dhcp: false
    #     mtu: 1500
    #     routes:
    #       - network: 0.0.0.0/0
    #         gateway: ${CLUSTER_LAN_GATEWAY}
controlPlane:
  filenameTmpl: "{{.ClusterName}}-{{.Hostname}}.yaml"
  certSANs:
    - 127.0.0.1
    - ${CLUSTER_ENDPOINT}
  kernelModules: []
  nameservers:
    - ${CLUSTER_DNS}
  disableSearchDomain: true
  machineFiles:
    - op: create
      path: /etc/cri/conf.d/20-customization.part
      content: |
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
        [plugins."io.containerd.cri.v1.runtime"]
          cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
          device_ownership_from_security_context = true
    - op: overwrite
      path: /etc/nfsmount.conf
      permissions: 0o644
      content: |
        [ NFSMount_Global_Options ]
        nfsvers=4.2
        hard=True
        nconnect=16
        noatime=True
  schematic:
    customization:
      extraKernelArgs:
        - init_on_alloc=0 # Less security, faster puter
        - init_on_free=0 # Less security, faster puter
      systemExtensions:
        officialExtensions:
          - siderolabs/nfsrahead # NFS Performance
  patches:
    - |-
      machine:
        sysctls:
          fs.inotify.max_user_instances: "8192" # Allow more file watchers for k8s pods
          fs.inotify.max_user_watches: "1048576" # Increase file watch limit for containers
          net.core.default_qdisc: fq # Fair Queuing scheduler for better network performance
          net.ipv4.tcp_mtu_probing: "1" # Auto-discover optimal packet sizes
          net.ipv4.tcp_window_scaling: "1" # Enable TCP window scaling for high-bandwidth networks
          net.ipv4.tcp_congestion_control: bbr # Use Google BBR for better throughput on RPi4 Gigabit
          net.core.rmem_max: "16777216" # Max socket receive buffer (16MB, RPi4-optimized)
          net.core.wmem_max: "16777216" # Max socket send buffer (16MB, RPi4-optimized)
          net.ipv4.neigh.default.gc_thresh1: "2048" # ARP cache thresholds for small cluster
          net.ipv4.neigh.default.gc_thresh2: "4096" # (Reduced for RPi4 memory constraints)
          net.ipv4.neigh.default.gc_thresh3: "8192" # Max ARP cache entries
          net.ipv4.tcp_fastopen: "3" # Enable TCP Fast Open for faster connections
          net.ipv4.tcp_rmem: "4096 87380 16777216" # TCP receive buffer sizes (min default max)
          net.ipv4.tcp_wmem: "4096 65536 16777216" # TCP send buffer sizes (16MB max for RPi4)
          sunrpc.tcp_max_slot_table_entries: "64" # NFS connection slots (reduced for RPi4)
          sunrpc.tcp_slot_table_entries: "64" # Active NFS slots (ARM-optimized)
          # user.max_user_namespaces: "11255"
          # vm.nr_hugepages: "1024"
        network:
          interfaces: []
        time:
          servers:
            - time.cloudflare.com
            - pool.ntp.org
            - time.google.com
          bootTimeout: 3m  # Extended timeout for RPi boot
        kubelet:
          defaultRuntimeSeccompProfileEnabled: true
          disableManifestsDirectory: true
          extraConfig:
            featureGates:
              ImageVolume: true
              ResourceHealthStatus: true
            serializeImagePulls: false
          nodeIP:
            validSubnets:
              - ${CLUSTER_LAN_SUBNET} # See talenv.yaml file
        features:
          kubernetesTalosAPIAccess:
            allowedKubernetesNamespaces:
              - actions-runner-system
              - system-upgrade
            allowedRoles:
              - os:admin
            enabled: true
          hostDNS:
            forwardKubeDNSToHost: false
            resolveMemberNames: true
      cluster:
        allowSchedulingOnControlPlanes: true
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
        coreDNS:
          disabled: true
        proxy:
          disabled: true
        discovery:
          registries:
            service:
              disabled: false
        scheduler:
          config:
            apiVersion: kubescheduler.config.k8s.io/v1
            kind: KubeSchedulerConfiguration
            profiles:
              - schedulerName: default-scheduler
                plugins:
                  score:
                    disabled:
                      - name: ImageLocality # Don't prioritize nodes with cached images
                pluginConfig:
                  - name: PodTopologySpread
                    args:
                      defaultingType: List # Apply default constraints to pods without explicit topology rules
                      defaultConstraints:
                        - maxSkew: 1 # Allow max 1 pod difference between nodes
                          topologyKey: kubernetes.io/hostname # Spread across different hostnames
                          whenUnsatisfiable: ScheduleAnyway # Schedule even if constraint can't be met
          extraArgs:
            bind-address: 0.0.0.0 # Listen on all interfaces for metrics/health checks
        apiServer:
          certSANs:
            - 127.0.0.1
            - k8s.internal
            - dramble.home.lab
          extraArgs:
            enable-aggregator-routing: "true"
            feature-gates: ImageVolume=true,MutatingAdmissionPolicy=true,ResourceHealthStatus=true
            runtime-config: admissionregistration.k8s.io/v1beta1=true
